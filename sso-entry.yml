# 入口垫片：只把「Accept 恰好是 text/html」的请求改写成浏览器式 Accept。
# 上游 OIDC 入口 /api/session/openid/auth 是 JAX-RS JSON 端点，Accept 不含 */* 时按内容协商回 406，
# 套件和脚本工具的登录跳转发的就是这种头；真实浏览器的 Accept 带着通配符，不会命中改写规则。
# 其余请求一律原样透传（含 WebSocket 升级）。
http:
  routers:
    sso-accept:
      rule: "HeaderRegexp(`Accept`, `^text/html$`)"
      middlewares: [sso-accept]
      service: traccar
      priority: 100
    pass:
      rule: "PathPrefix(`/`)"
      service: traccar
  middlewares:
    sso-accept:
      headers:
        customRequestHeaders:
          Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
  services:
    traccar:
      loadBalancer:
        servers:
          - url: "http://traccar:8082"
